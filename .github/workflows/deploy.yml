name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

jobs:
  deploy:
    runs-on: self-hosted
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Stop old container
        run: |
          docker stop aws-cost-dashboard || true
          docker rm aws-cost-dashboard || true

      - name: Run new container
        run: |
          docker run -d \
            --name aws-cost-dashboard \
            --restart unless-stopped \
            -p 3001:3001 \
            aws-cost-dashboard:latest
